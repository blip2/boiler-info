services:
  poll:
    build: .
    container_name: poll
    env_file:
      - .env
    depends_on:
      - influxdb
    devices:
      - /dev/ttyUSB0
    restart: always

  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    volumes:
      - ./influxdb:/var/lib/influxdb3:rw
    command:
      - influxdb3
      - serve
      - --node-id=${INFLUXDB_NODE_ID}
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'Authorization: Bearer ${INFLUXDB_TOKEN}' http://localhost:${INFLUXDB_HTTP_PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - ${INFLUXDB_HTTP_PORT}:8181

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    volumes:
      - ./grafana:/var/lib/grafana:rw
    depends_on:
      - influxdb
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_SERVER_ROOT_URL=https://boiler.blip2.net/
    restart: always
    ports:
      - 3000:3000

  grafana-ntfy:
    image: academo/grafana-ntfy:latest
    hostname: grafana-ntfy
    expose:
      - 8080
    command: "-ntfy-url=https://ntfy.blip2.net/lmws"
